version: '3.8'

services:
  # 1. Containerized Android Emulator with Built-in Appium & noVNC Web UI
  android-emulator:
    image: budtmo/docker-android:emulator_11.0
    container_name: appium_docker_emulator
    privileged: true
    shm_size: '2gb'
    ports:
      - "4723:4723"   # Host Port 4723 -> Container Appium Port
      - "6080:6080"   # Host Port 6080 -> Web VNC Interface
      - "5555:5555"   # Host Port 5555 -> ADB Communication Port
    environment:
      - DEVICE=Samsung Galaxy S10   # Standard stable device preset for noVNC
      - APPIUM=true
      - WEB_VNC=true
      - RELAXED_SECURITY=true
      - EMULATOR_ARGS=-gpu off -no-window -no-audio
    deploy:
      resources:
        limits:
          memory: 4G

  # 2. Appium Server for Real Physical Devices (Optional / Separate)
  appium-real-device:
    image: appium/appium:latest
    container_name: appium_real_device
    privileged: true
    ports:
      - "4724:4723"   # Host Port 4724 -> Container Appium Port
      - "5037:5037"   # Host Port 5037 -> ADB Server Port
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - RELAXED_SECURITY=1
    command: appium --allow-insecure=relaxed-security