name: Cross Version- Android Emulator Suite
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ====================================================
  # JOB 1: PARALLEL EMULATOR MATRIX (Android 12, 13, 14)
  # ====================================================
  emulator-tests:
    name: Emulator - Android ${{ matrix.android-version }} (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false # Continues running other versions even if one fails
      matrix:
        include:
          - android-version: "12.0"
            api-level: 31
            target: google_apis
          - android-version: "13.0"
            api-level: 33
            target: google_apis
          - android-version: "14.0"
            api-level: 34
            target: google_apis

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Install Appium Server & Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium Server
        run: |
          appium --log appium-emulator-${{ matrix.api-level }}.log &
          sleep 5

      - name: Run Tests on Android ${{ matrix.android-version }} Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install src/main/resources/APKFiles/ApiDemos-release.apk
            mvn clean test -DplatformVersion=${{ matrix.android-version }} -DserverIp=127.0.0.1 -Dport=4723

      - name: Upload Execution Reports for Android ${{ matrix.android-version }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Emulator-Report-Android-${{ matrix.android-version }}
          path: |
            target/surefire-reports/
            test-output/
            reports/
            appium-emulator-${{ matrix.api-level }}.log

